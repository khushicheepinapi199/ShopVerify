name: ShopVerify browser tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run integration and browser tests
        run: mvn -B verify -Dheadless=true
      - name: Verify saved accounts survive restart
        run: python3 scripts/check_persistence.py
      - name: Upload reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopverify-test-results
          path: |
            target/surefire-reports/
            target/failure-evidence/
          if-no-files-found: warn
