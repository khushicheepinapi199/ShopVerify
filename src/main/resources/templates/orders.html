<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orders · ShopVerify</title><link rel="stylesheet" href="/css/shop.css"></head><body><header><a class="brand" href="/products">ShopVerify<span>everyday essentials</span></a><nav th:if="${username != null}"><a href="/products">Shop</a><a href="/cart">Cart <b data-test="cart-count" th:text="${cartCount}"></b></a><a href="/orders">Orders</a><span th:text="${username}"></span><form th:action="@{/logout}" method="post"><button class="quiet" data-test="logout">Log out</button></form></nav></header><main><h1>Your orders</h1><p th:if="${#lists.isEmpty(orders)}">No orders yet.</p><article class="order" th:each="order:${orders}"><a th:href="@{/orders/{id}(id=${order.id})}" th:text="${'Order #' + order.id}"></a><span th:text="${order.createdAt}"></span><strong th:text="${'$' + order.total}"></strong></article></main><footer>A learning store · simulated orders · no payments collected</footer></body></html>
