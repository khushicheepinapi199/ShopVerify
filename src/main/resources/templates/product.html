<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product · ShopVerify</title><link rel="stylesheet" href="/css/shop.css"></head><body><header><a class="brand" href="/products">ShopVerify<span>everyday essentials</span></a><nav th:if="${username != null}"><a href="/products">Shop</a><a href="/cart">Cart <b data-test="cart-count" th:text="${cartCount}"></b></a><a href="/orders">Orders</a><span th:text="${username}"></span><form th:action="@{/logout}" method="post"><button class="quiet" data-test="logout">Log out</button></form></nav></header><main><a href="/products">← Back to essentials</a><section class="detail"><img th:src="@{/images/{image}.svg(image=${product.image})}" th:alt="${product.name}"><div><p class="eyebrow">EVERYDAY COLLECTION</p><h1 data-test="product-name" th:text="${product.name}"></h1><p th:text="${product.description}"></p><h2 data-test="product-price" th:text="${'$' + product.price}"></h2><form th:action="@{/cart/add}" method="post"><input type="hidden" name="id" th:value="${product.id}"><button data-test="add">Add to cart</button></form></div></section></main><footer>A learning store · simulated orders · no payments collected</footer></body></html>
