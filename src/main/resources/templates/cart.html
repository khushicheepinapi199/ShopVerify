<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cart · ShopVerify</title><link rel="stylesheet" href="/css/shop.css"></head><body><header><a class="brand" href="/products">ShopVerify<span>everyday essentials</span></a><nav th:if="${username != null}"><a href="/products">Shop</a><a href="/cart">Cart <b data-test="cart-count" th:text="${cartCount}"></b></a><a href="/orders">Orders</a><span th:text="${username}"></span><form th:action="@{/logout}" method="post"><button class="quiet" data-test="logout">Log out</button></form></nav></header><main><h1 data-test="title">Your cart</h1><p class="error" data-test="error" th:if="${error}" th:text="${error}"></p><p data-test="empty" th:if="${#lists.isEmpty(lines)}">Your cart is empty. Find something you love.</p><article class="cart-line" data-test="cart-line" th:each="line:${lines}"><img th:src="@{/images/{image}.svg(image=${line.product.image})}" th:alt="${line.product.name}"><div><h3 th:text="${line.product.name}"></h3><p th:text="${'$' + line.product.price + ' each'}"></p></div><form th:action="@{/cart/update}" method="post"><input type="hidden" name="id" th:value="${line.product.id}"><label>Quantity<input data-test="quantity" type="number" min="1" max="10" name="quantity" th:value="${line.quantity}"></label><button data-test="update" class="quiet">Update</button></form><strong data-test="line-total" th:text="${'$' + line.amount}"></strong><form th:action="@{/cart/remove}" method="post"><input type="hidden" name="id" th:value="${line.product.id}"><button class="quiet" data-test="remove">Remove</button></form></article><aside class="summary"><h2>Order summary</h2><p>Subtotal <strong data-test="subtotal" th:text="${'$' + subtotal}"></strong></p><p>Demo tax (8%) <strong data-test="tax" th:text="${'$' + tax}"></strong></p><p class="total">Total <strong data-test="total" th:text="${'$' + total}"></strong></p></aside><div class="actions"><a href="/products">Continue shopping</a><a class="button" data-test="checkout" href="/checkout" th:if="${!#lists.isEmpty(lines)}">Go to checkout</a></div></main><footer>A learning store · simulated orders · no payments collected</footer></body></html>
