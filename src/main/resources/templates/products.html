<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop · ShopVerify</title><link rel="stylesheet" href="/css/shop.css"></head><body><header><a class="brand" href="/products">ShopVerify<span>everyday essentials</span></a><nav th:if="${username != null}"><a href="/products">Shop</a><a href="/cart">Cart <b data-test="cart-count" th:text="${cartCount}"></b></a><a href="/orders">Orders</a><span th:text="${username}"></span><form th:action="@{/logout}" method="post"><button class="quiet" data-test="logout">Log out</button></form></nav></header><main><section class="hero"><p class="eyebrow">SMALL THINGS. BETTER DAYS.</p><h1>Made for your everyday.</h1><p>A considered collection for work, weekends and everything between.</p></section><div class="toolbar"><h2 data-test="title">Our essentials</h2><form action="/products" method="get"><label>Sort by <select name="sort" data-test="sort" onchange="this.form.submit()"><option value="az" th:selected="${sort == 'az'}">Name A–Z</option><option value="za" th:selected="${sort == 'za'}">Name Z–A</option><option value="lohi" th:selected="${sort == 'lohi'}">Price low to high</option><option value="hilo" th:selected="${sort == 'hilo'}">Price high to low</option></select></label></form></div><p class="error" th:if="${error}" th:text="${error}"></p><section class="grid"><article class="card" data-test="product" th:each="p:${products}" th:attr="data-id=${p.id}"><a th:href="@{/products/{id}(id=${p.id})}"><img th:src="@{/images/{image}.svg(image=${p.image})}" th:alt="${p.name}"><h3 data-test="product-name" th:text="${p.name}"></h3></a><p th:text="${p.description}"></p><div class="card-bottom"><strong data-test="product-price" th:text="${'$' + p.price}"></strong><form th:action="@{/cart/add}" method="post"><input type="hidden" name="id" th:value="${p.id}"><button data-test="add">Add to cart</button></form></div></article></section></main><footer>A learning store · simulated orders · no payments collected</footer></body></html>
