<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout · ShopVerify</title><link rel="stylesheet" href="/css/shop.css"></head><body><header><a class="brand" href="/products">ShopVerify<span>everyday essentials</span></a><nav th:if="${username != null}"><a href="/products">Shop</a><a href="/cart">Cart <b data-test="cart-count" th:text="${cartCount}"></b></a><a href="/orders">Orders</a><span th:text="${username}"></span><form th:action="@{/logout}" method="post"><button class="quiet" data-test="logout">Log out</button></form></nav></header><main><h1 data-test="title">Checkout</h1><p>Use fictional details. This checkout places a simulated order.</p><p class="error" data-test="error" th:if="${error}" th:text="${error}"></p><div class="checkout-layout"><form th:action="@{/checkout}" method="post"><label>Full name<input name="fullName" data-test="fullName" maxlength="100" required></label><label>Delivery address<textarea name="address" data-test="address" maxlength="200" required></textarea></label><button data-test="place-order">Place demo order</button><a data-test="cancel" href="/cart">Cancel</a></form><aside class="summary"><h2>Order summary</h2><p>Subtotal <strong data-test="subtotal" th:text="${'$' + subtotal}"></strong></p><p>Demo tax (8%) <strong data-test="tax" th:text="${'$' + tax}"></strong></p><p class="total">Total <strong data-test="total" th:text="${'$' + total}"></strong></p></aside></div></main><footer>A learning store · simulated orders · no payments collected</footer></body></html>
