<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order confirmed · ShopVerify</title><link rel="stylesheet" href="/css/shop.css"></head><body><header><a class="brand" href="/products">ShopVerify<span>everyday essentials</span></a><nav th:if="${username != null}"><a href="/products">Shop</a><a href="/cart">Cart <b data-test="cart-count" th:text="${cartCount}"></b></a><a href="/orders">Orders</a><span th:text="${username}"></span><form th:action="@{/logout}" method="post"><button class="quiet" data-test="logout">Log out</button></form></nav></header><main><section class="auth"><p class="eyebrow">ALL SET</p><h1 data-test="confirmation">Thank you for your order!</h1><p>Demo order <strong th:text="${order.id}"></strong> is confirmed.</p><p>Total <strong th:text="${'$' + order.total}"></strong></p><a class="button" href="/products">Continue shopping</a></section></main><footer>A learning store · simulated orders · no payments collected</footer></body></html>
