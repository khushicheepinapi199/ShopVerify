<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · ShopVerify</title><link rel="stylesheet" href="/css/shop.css"></head><body><header><a class="brand" href="/products">ShopVerify<span>everyday essentials</span></a><nav th:if="${username != null}"><a href="/products">Shop</a><a href="/cart">Cart <b data-test="cart-count" th:text="${cartCount}"></b></a><a href="/orders">Orders</a><span th:text="${username}"></span><form th:action="@{/logout}" method="post"><button class="quiet" data-test="logout">Log out</button></form></nav></header><main><section class="auth"><p class="eyebrow">MAKE YOURSELF AT HOME</p><h1>Create your account.</h1><p>Choose your own username and password.</p><p class="error" data-test="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/register}" method="post"><label>Username<input data-test="username" name="username" th:value="${enteredUsername}" pattern="[a-z0-9_]{3,32}" minlength="3" maxlength="32" autocomplete="username" required><small>3–32 lowercase letters, numbers or underscores.</small></label><label>Password<input data-test="password" name="password" type="password" minlength="8" maxlength="64" autocomplete="new-password" required><small>8–64 characters.</small></label><label>Confirm password<input data-test="confirmation" name="confirmation" type="password" autocomplete="new-password" required></label><button data-test="register-button">Create account</button></form><p>Already registered? <a href="/login">Log in</a></p></section></main><footer>A learning store · simulated orders · no payments collected</footer></body></html>
